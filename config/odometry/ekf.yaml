ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.25
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    odom0: /odom/drive_validated
    # Directional step-velocity fallback, only in confirmed lidar-weak geometry.
    # Strong directions have high covariance; wheel yaw is never fused.
    odom0_config: [false, false, false,
                   false, false, false,
                   true, true, false,
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false

    odom1: /odom/rf2o_fusion
    # Adapter derives body-frame vx/vy from RF2O pose increments and publishes
    # explicit directional velocity covariance. No differential covariance
    # conversion and no wheel/RF2O yaw input: gyro is the heading authority.
    odom1_config: [false, false, false,
                   false, false, false,
                   true, true, false,
                   false, false, false,
                   false, false, false]
    odom1_queue_size: 10
    odom1_differential: false

    # Independent BNO heading, relative to the first sample after EKF startup.
    # Do not invent angular velocity from wheel motion or missing IMU fields.
    imu0: /imu/gyro
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, false,
                  false, false, false]
    imu0_relative: true
    imu0_differential: false
    imu0_queue_size: 10
