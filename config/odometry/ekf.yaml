ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.25
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    odom0: /odom/drive_raw
    # Open-loop step positions are deliberately excluded.  The controller's
    # instantaneous x/y/yaw-rate estimate keeps healthy motion responsive.
    odom0_config: [false, false, false,
                   false, false, false,
                   true, true, false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false

    odom1: /odom/rf2o
    # RF2O supplies independent planar pose change. Its twist is not useful
    # for a holonomic base, so it is intentionally not fused.
    odom1_config: [true, true, false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_queue_size: 10
    odom1_differential: true
