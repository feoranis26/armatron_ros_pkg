lidar_confidence:
  ros__parameters:
    base_frame: base_link
    comparison_seconds: 0.6
    accumulation_seconds: 1.8
    max_points: 240
    min_points: 30
    max_gap: 0.5
    match_distance: 0.4
    residual_cap: 0.25
    min_overlap: 0.55
    max_overlap_loss: 0.25
    max_error: 0.12
    weak_ratio: 0.03
    min_strength: 0.005
    rotation_scale: 2.0
    score_margin: 0.025
    directional_ratio: 0.20  # constraint along tested translation / strongest translation
    # Initial diagnostic thresholds, not calibrated confidence probabilities.
    # Directional geometry is consumed by the fusion adapter.
