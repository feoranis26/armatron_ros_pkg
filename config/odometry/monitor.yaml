motion_consistency_monitor:
  ros__parameters:
    adaptive_fusion: true
    wheel_fallback: true
    rf_velocity_variance: 0.0025
    rf_weak_velocity_variance: 1.0
    wheel_fallback_variance: 0.04
    fusion_weak_ratio: 0.20
    distance_floor: 0.015
    relative_error: 0.4
    angle_floor: 0.10
    timing_tolerance: 0.2
    rotation_translation_tolerance: 0.125
    # Idle scan-matching noise allowance (diagnostics/optional fusion only).
    # Driving comparisons retain the tighter distance/angle floors above.
    stationary_distance: 0.08  # metres per comparison window
    stationary_angle: 0.25   # radians per comparison window
    # Variances above are (m/s)^2, bounded policy values, not calibrated
    # sensor covariance. Disable wheel_fallback to accept hallway uncertainty.
